spring.application.name=auth
spring.threads.virtual.enabled=true
server.port=9090
#
spring.datasource.url=jdbc:postgresql://localhost:30000/mydatabase
spring.datasource.username=myuser
spring.datasource.password=secret
#
arconia.multitenancy.resolution.http.header.enabled=true
arconia.multitenancy.resolution.http.header.header-name=x-tenant-id
arconia.multitenancy.resolution.oauth2.enabled=true
#
spring.security.oauth2.authorizationserver.client.myclient.registration.client-id=myclient
spring.security.oauth2.authorizationserver.client.myclient.registration.client-secret={noop}mysecret
spring.security.oauth2.authorizationserver.client.myclient.registration.client-authentication-methods[0]=client_secret_basic
spring.security.oauth2.authorizationserver.client.myclient.registration.authorization-grant-types[0]=authorization_code
spring.security.oauth2.authorizationserver.client.myclient.registration.authorization-grant-types[1]=client_credentials
spring.security.oauth2.authorizationserver.client.myclient.registration.authorization-grant-types[2]=refresh_token
spring.security.oauth2.authorizationserver.client.myclient.registration.authorization-grant-types[3]=urn:ietf:params:oauth:grant-type:device_code
spring.security.oauth2.authorizationserver.client.myclient.registration.redirect-uris[0]=http://127.0.0.1:8080/login/oauth2/code/myclient
spring.security.oauth2.authorizationserver.client.myclient.registration.scopes[0]=openid
spring.security.oauth2.authorizationserver.client.myclient.registration.scopes[1]=profile
spring.security.oauth2.authorizationserver.client.myclient.registration.scopes[2]=email
spring.security.oauth2.authorizationserver.client.myclient.registration.scopes[3]=user.write
spring.security.oauth2.authorizationserver.client.myclient.registration.scopes[4]=user.read
