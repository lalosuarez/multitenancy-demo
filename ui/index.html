<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers</title>
</head>
<body>
<template id="row">
    <div class="customer">
        <div class="id" hidden="true"></div>
        <div class="name"></div>
    </div>
</template>

<h1>Customers</h1>
<div id="m"></div>

<script type="module">
    const res = await fetch('/api/customers')
    const customers = await res.json()
    m.append(...customers.map(({id, name}) => {
        const c = row.content.cloneNode(true)
        c.querySelector('.id').textContent = id
        c.querySelector('.name').textContent = name
        return c
    }))
</script>
</body>
</html>
